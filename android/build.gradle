plugins {
    id 'com.android.application' version '8.7.3'
}
android {
    namespace 'cl.partescan.captura'
    compileSdk 35
    defaultConfig {
        applicationId 'cl.partescan.captura'
        minSdk 28
        targetSdk 35
        versionCode 15
        versionName '1.1.1'
    }
    signingConfigs {
        release {
            if (System.getenv('ANDROID_KEYSTORE_PATH')) {
                storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                storeType 'PKCS12'
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias 'partescan'
                keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }
}
if (gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') } && !System.getenv('ANDROID_KEYSTORE_PATH')) {
    throw new GradleException('Falta la clave de firma para compilar el APK de release.')
}
dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'androidx.core:core:1.13.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
