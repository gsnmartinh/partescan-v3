name: Compilar ParteScan para Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version a publicar como Release (ej. v1.0.0). Dejar vacio = solo compilar"
        required: false
        default: ""      # botón "Run workflow"
  push:
    branches: [main, master, fix/activar-aceptar-y-refrescar-datos]
    tags: ["v*"]          # al crear una versión (v1.0.0, v1.1.0…) se publica una Release con el zip

concurrency:
  group: compilar-${{ github.ref }}
  cancel-in-progress: true   # si subes dos cambios seguidos, solo se compila el último

permissions:
  contents: write      # necesario para adjuntar el zip a la Release

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK con firma estable
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/partescan-release.p12"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          gradle -p android assembleRelease
      - name: Preparar APK instalable
        run: |
          apk_version=$(awk -F"'" '/versionName/{print $2}' android/build.gradle)
          apk_name="ParteScan-Captura-$apk_version.apk"
          cp android/build/outputs/apk/release/*.apk "$apk_name"
          sha256sum "$apk_name" > "$apk_name.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ParteScan-Captura
          path: ParteScan-Captura-*.apk*
          if-no-files-found: error
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias de Python
        run: pip install -r requirements.txt

      - name: Pruebas del perfil y del reconocimiento
        run: python tests/prueba_perfil.py

      - name: Pruebas del tecleo desde ParteScan
        run: python tests/prueba_tecleador.py

      - name: Probar la edición de tandas y los tipos de vehículo
        run: python tests/prueba_edicion_tanda.py

      - name: Probar la actualización automática
        run: |
          python tests/prueba_actualizador.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/prueba_actualizacion_diferencial.py

      - name: Instalar Tesseract (motor de OCR, gratuito)
        run: choco install tesseract -y --no-progress

      - name: Preparar Tesseract portable con español
        shell: pwsh
        run: |
          $src = "C:\Program Files\Tesseract-OCR"
          New-Item -ItemType Directory -Force -Path build\tesseract | Out-Null
          Copy-Item "$src\*" build\tesseract -Recurse -Force
          New-Item -ItemType Directory -Force -Path build\tesseract\tessdata | Out-Null
          Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tessdata_best/raw/main/spa.traineddata" -OutFile build\tesseract\tessdata\spa.traineddata
          Get-ChildItem build\tesseract\tessdata
          $env:TESSDATA_PREFIX = (Resolve-Path build\tesseract\tessdata).Path
          & build\tesseract\tesseract.exe --list-langs

      - name: Escribir la versión dentro del programa
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'dev' }}"
          if ($v -eq 'dev') { $v = python -c "from parte_scan.version import VERSION; print(VERSION)" }
          Set-Content -Path parte_scan\version.py -Encoding utf8 -Value "VERSION = `"$v`""
          Get-Content parte_scan\version.py

      - name: Crear el programa (.exe)
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --name ParteScan --windowed `
            --add-data "build\tesseract;tesseract" `
            --add-data "parte_scan\web;parte_scan\web" `
            --add-data "parte_scan\catalogo.json;parte_scan" `
            --add-data "parte_scan\comunas_sistema.txt;parte_scan" `
            --collect-all pypdfium2_raw --collect-all pypdfium2 `
            --collect-all rapidocr_onnxruntime --collect-all onnxruntime `
            --hidden-import pywinauto.keyboard `
            --collect-all webview --collect-all pythonnet --collect-all clr_loader `
            partescan.py
          Copy-Item parte_scan\LEEME.txt dist\ParteScan\LEEME.txt

      - name: Comprobar que el programa arranca
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\ParteScan\ParteScan.exe -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 12
          $r = Invoke-WebRequest -Uri http://127.0.0.1:8765/api/estado -UseBasicParsing
          Write-Host $r.Content
          $t = Invoke-WebRequest -Uri http://127.0.0.1:8765/api/tecleo/estado -UseBasicParsing
          Write-Host $t.Content
          if ($t.Content -notmatch '"disponible":\s*true') { throw "El tecleo no quedo disponible dentro del programa" }
          Stop-Process -Id $p.Id -Force

      - name: Crear el instalador (Setup.exe)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $v = "${{ github.event.inputs.version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'dev' }}"
          if ($v -eq 'dev') { $v = python -c "from parte_scan.version import VERSION; print(VERSION)" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DVersion=$v" instalador\ParteScan.iss
          # huella SHA-256: el programa la comprueba antes de ejecutar una actualización descargada
          Get-ChildItem salida\*.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            Set-Content -Path ($_.FullName + ".sha256") -Value "$h  $($_.Name)" -NoNewline -Encoding ascii
          }
          Get-ChildItem salida

      - uses: actions/upload-artifact@v4
        with:
          name: ParteScan-Instalador
          retention-days: 14
          path: salida/*

      - uses: actions/upload-artifact@v4
        with:
          name: ParteScan-Windows
          retention-days: 14        # los compilados viejos se borran solos a los 14 días
          path: dist/ParteScan

  release:
    needs: [android, build]
    if: ${{ github.event.inputs.version != '' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: ParteScan-Windows
          path: dist/ParteScan
      - uses: actions/download-artifact@v4
        with:
          name: ParteScan-Instalador
          path: salida
      - uses: actions/download-artifact@v4
        with:
          name: ParteScan-Captura
          path: apk
      - name: Publicar en la Release (solo al crear una versión)
        if: ${{ github.event.inputs.version != '' || startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.event.inputs.version || github.ref_name }}"
          Compress-Archive -Path "dist\ParteScan" -DestinationPath "ParteScan-Windows-$tag.zip"
          python herramientas/empaquetar_actualizacion.py dist/ParteScan build/actualizacion $tag
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release create $tag --title "ParteScan $tag" --target ${{ github.sha }} --notes-file RELEASE_NOTES.md 2>$null
          $assets = @("ParteScan-Windows-$tag.zip") + (Get-ChildItem salida\*).FullName + (Get-ChildItem build/actualizacion/*).FullName + (Get-ChildItem apk/*).FullName
          gh release upload $tag @assets --clobber
