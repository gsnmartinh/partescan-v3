name: Compilar ParteScan Captura Android
on:
  workflow_dispatch:
  push:
    branches: [codex/android-captura, codex/android-fluent2]
    tags: ['android-v*']
    paths: ['android/**', '.github/workflows/android.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Comprobar navegación, revisión y diseño
        run: gradle -p android testDebugUnitTest lintDebug
      - name: Compilar APK con firma estable
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/partescan-release.p12"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          gradle -p android assembleRelease
          cp android/build/outputs/apk/release/*.apk ParteScan-Captura-0.10.2.apk
          sha256sum ParteScan-Captura-0.10.2.apk > ParteScan-Captura-0.10.2.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ParteScan-Captura-0.10.2
          path: ParteScan-Captura-0.10.2.apk*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Revision-interfaz-Android
          path: |
            android/build/test-screenshots/*.png
            android/build/reports/tests/
            android/build/reports/lint-results-debug.html
            android/build/test-results/
      - name: Publicar APK Android
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" ParteScan-Captura-0.10.2.apk* --title "ParteScan Captura 0.10.2" --notes-file android/RELEASE_NOTES.md --latest=false
