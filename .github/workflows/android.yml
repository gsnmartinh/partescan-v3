name: APK ParteScan de prueba
on:
  workflow_dispatch:
  push:
    branches: [codex/android-captura]
    paths: ['android/**', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ParteScan-Captura
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
